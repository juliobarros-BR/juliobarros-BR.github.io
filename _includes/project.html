<article class="project">
  <div class="project-media">
    <img src="{{ include.project.image | prepend: '/assets/images/' | relative_url }}" alt="{{ include.project.alt | default: '' | escape }}" loading="lazy" decoding="async">
  </div>
  <div class="project-body">
    {% if include.project.venue %}<p class="eyebrow">{{ include.project.venue }}</p>{% endif %}
    <{{ include.heading }}>{{ include.project.title }}</{{ include.heading }}>
    {% if include.project.description %}<p>{{ include.project.description }}</p>{% endif %}
    {% if include.project.url %}<a class="text-link" href="{{ include.project.url }}" aria-label="{{ include.project.label }} — {{ include.project.title | escape }}">{{ include.project.label }}</a>{% endif %}
  </div>
</article>
