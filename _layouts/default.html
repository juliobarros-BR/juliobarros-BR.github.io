<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
      <label class="theme-control" hidden>
        Theme
        <select id="site-theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </label>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    {{ content }}
  </main>
  <footer class="site-footer" id="contact">
    <div class="shell footer-inner">
      <div>
        <h2>Get in touch</h2>
        <a href="mailto:julioortizbarros@gmail.com">julioortizbarros@gmail.com</a>
      </div>
      <nav aria-label="Professional profiles">
        <a href="{{ site.linkedin }}">LinkedIn</a>
        <a href="{{ site.github }}">GitHub</a>
        <a href="{{ site.google_scholar }}">Google Scholar</a>
      </nav>
    </div>
  </footer>
</body>
</html>
